# sun.misc.unsafe.memory.access: dependencies compiled before Scala 3.8 have lazy vals going through
# sun.misc.Unsafe, which prints warnings from JDK 24 on (JEP 498), and these warnings are compiled
# into the image. sun.misc.Unsafe reads the property once and for all at image build time, so it has
# to be set here: setting it when running the image has no effect.
Args = --no-fallback \
       --enable-url-protocols=http,https \
       --enable-native-access=ALL-UNNAMED \
       -H:+ReportExceptionStackTraces \
       -H:+UnlockExperimentalVMOptions \
       --initialize-at-build-time=coursier.util.Properties\$ \
       --initialize-at-build-time=org.jline.utils.InputStreamReader \
       --initialize-at-build-time=org.jline.utils.InfoCmp \
       --initialize-at-build-time=scala.runtime.LazyVals\$ \
       -H:IncludeResources=library.properties \
       -H:IncludeResources=bootstrap.*\\.jar \
       -H:IncludeResources=completions/.* \
       -H:IncludeResources=coursier/coursier.properties \
       -H:IncludeResources=coursier/launcher/coursier.properties \
       -H:IncludeResources=coursier/launcher/.*\\.bat \
       -H:-ParseRuntimeOptions \
       -Djdk.http.auth.tunneling.disabledSchemes= \
       -Dsun.misc.unsafe.memory.access=allow \
       -Dfile.encoding=UTF-8 \
       -Dstdout.encoding=UTF-8 \
       -Dstderr.encoding=UTF-8
