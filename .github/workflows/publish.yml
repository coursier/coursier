name: Publish

on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Delete tag if building from a branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
      - uses: coursier/cache-action@v8
        with:
          disableFallback: true
      # a 'v*' tag releases the coursier modules, and the interface ones too if an
      # 'interface-v*' tag sits on the same commit (they are left out of the release otherwise)
      - name: Check publish versions
        run: ./mill -i ci.checkPublishVersions
      - name: Publish
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # the interface modules are versioned from the 'interface-v*' tags: with no such tag
            # on this commit, they are snapshots, and get left out of the release
            if [ -z "$(git tag -l 'interface-v*' --points-at HEAD)" ]; then
              PUBLISH_ARTIFACTS_OPTS=(--publishArtifacts '__:PublishModule:^InterfacePublishModule.publishArtifacts')
            else
              PUBLISH_ARTIFACTS_OPTS=()
            fi
            # --shouldRelease false: the bundle is uploaded and validated on Sonatype Central, but has
            # to be published manually from https://central.sonatype.com/publishing/deployments
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ "${PUBLISH_ARTIFACTS_OPTS[@]}" --bundleName "coursier-${GITHUB_REF#refs/tags/v}" --shouldRelease false
          else
            for tag in $(git tag --points-at HEAD); do
              git tag -d "$tag"
            done
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/
          fi
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
