name: Publish

on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    # for the PGP and Sonatype secrets
    environment: release
    # can only narrow down the permissions of the calling job in ci.yml
    permissions:
      contents: read
      packages: write
    # Never publish to Sonatype Central from two jobs at a time (nightlies of successive pushes,
    # or a nightly and a release). A job waits for the running one rather than cancelling it.
    # GitHub keeps only one waiting job per group though, and cancels an older waiting one.
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Delete tag if building from a branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
        with:
          disableFallback: true
      # a 'v*' tag releases the coursier modules, and the interface ones too if an
      # 'interface-v*' tag sits on the same commit (they are left out of the release otherwise)
      - name: Check publish versions
        run: ./mill -i ci.checkPublishVersions
      - name: Select artifacts to publish
        run: |
          # LocalOnlyPublishModule modules are never published to remote repositories. On tags,
          # the interface modules are versioned from the 'interface-v*' tags: with no such tag on
          # this commit, they are snapshots, and get left out of the release too.
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ -z "$(git tag -l 'interface-v*' --points-at HEAD)" ]; then
            echo "PUBLISH_ARTIFACTS=__:PublishModule:^InterfacePublishModule:^LocalOnlyPublishModule.publishArtifacts" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_ARTIFACTS=__:PublishModule:^LocalOnlyPublishModule.publishArtifacts" >> "$GITHUB_ENV"
          fi
      # Write the files to publish to out/staged-repository, then publish these rather than
      # publishArtifacts below: our JARs aren't reproducible, so this makes sure the attested
      # files are the published ones
      - name: Stage artifacts to publish
        run: |
          ./mill -i ci.stageAll --publishArtifacts "$PUBLISH_ARTIFACTS"
          echo "STAGED_ARTIFACTS=${PUBLISH_ARTIFACTS%.publishArtifacts}.stagedPublishArtifacts" >> "$GITHUB_ENV"
      # Like the launchers, only releases get attested (needs the 'id-token: write' and
      # 'attestations: write' permissions, granted by the 'publish' job in ci.yml). Check with
      # 'gh attestation verify coursier_2.13-X.Y.Z.jar --repo coursier/coursier'.
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: out/staged-repository/**
      - name: Publish to Sonatype Central
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # --shouldRelease false: the bundle is uploaded and validated on Sonatype Central, but has
            # to be published manually from https://central.sonatype.com/publishing/deployments
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --publishArtifacts "$STAGED_ARTIFACTS" --bundleName "coursier-${GITHUB_REF#refs/tags/v}" --shouldRelease false
          else
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --publishArtifacts "$STAGED_ARTIFACTS"
          fi
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      # Same artifacts, snapshots included, to https://github.com/orgs/coursier/packages
      # (needs the 'packages: write' permission, granted by the calling jobs in ci.yml).
      # Best effort: Sonatype Central is the source of truth, so a failure here shouldn't hold
      # back the jobs uploading launchers and bumping versions after a release.
      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          ./mill -i mill.javalib.MavenPublishModule/publishAll \
            --publishArtifacts "$STAGED_ARTIFACTS" \
            --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
            --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
        env:
          MILL_MAVEN_USERNAME: ${{ github.actor }}
          MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
