rules = [
  DisableSyntax
  // NoIsInstanceOf lives in modules/scalafix-rules, and is put on Scalafix's tool class path by
  // CsScalaModule#scalafixToolClasspath
  NoIsInstanceOf
]

// no `return`: it is compiled to a thrown NonLocalReturnControl, which any enclosing catch-all
// can swallow, and it silently returns from the wrong method when moved inside a lambda
DisableSyntax.noReturns = true
