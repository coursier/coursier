version = "3.9.6"

project.git = true
align.preset = more
maxColumn = 100
assumeStandardLibraryStripMargin = true
indent.defnSite = 2
indentOperator.topLevelOnly = false
align.preset = more
align.openParenCallSite = false
newlines.source = keep
newlines.beforeMultiline = keep
newlines.afterCurlyLambdaParams = keep
newlines.alwaysBeforeElseAfterCurlyIf = true

runner.dialect = scala213

rewrite.rules = [
  RedundantBraces
  RedundantParens
  SortModifiers
]

rewrite.redundantBraces {
  ifElseExpressions = true
  includeUnitMethods = false
  stringInterpolation = true
}

rewrite.sortModifiers.order = [
  "private", "final", "override", "protected",
  "implicit", "sealed", "abstract", "lazy"
]
project.excludeFilters = [
  "modules/directories"
  "modules/windows-ansi"
  "modules/unroll/plugin"
  // Vendored mill-native-image sources, Scala 3 and not parseable with the dialect above
  "mill-build/src/io/github/alexarchambault/millnativeimage"
]

// Sources only compiled with Scala 3 can use its syntax
fileOverride {
  // scala-3 directories of cross-compiled modules
  "glob:**/src/**/scala-3/**" {
    runner.dialect = scala3
  }
  // Scala 3 only modules
  "glob:**/modules/cli/**" {
    runner.dialect = scala3
  }
  "glob:**/modules/cli-tests/**" {
    runner.dialect = scala3
  }
  "glob:**/modules/docker/**" {
    runner.dialect = scala3
  }
  "glob:**/modules/launcher-native_04/**" {
    runner.dialect = scala3
  }
  "glob:**/modules/unroll/**" {
    runner.dialect = scala3
  }
}
