updates.ignore = [ { groupId = "org.scalaz", artifactId = "scalaz-core" } ]

updates.pin = [
  # tika 3.x is compiled for Java 11, and we still support Java 8
  { groupId = "org.apache.tika", artifactId = "tika-core", version = "2." },
  # slf4j-api is the only unshaded dependency of the published interface module.
  # Sticking to 1.x lets that module be used from applications relying on either
  # slf4j 1.x or 2.x - a 2.x one would make applications still relying on a 1.x
  # binding silently fall back to NOP. Note that slf4j-nop, only used in tests,
  # is deliberately left unpinned.
  { groupId = "org.slf4j", artifactId = "slf4j-api", version = "1." },
  # Stick to the Scala 3 LTS line
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = "3.3." }
  # jsoniter-scala 2.13.9 and later target Java 11, and the Scala 2 artifacts still support
  # Java 8, while the Scala 3 ones only support Java 17. Pins here match on the artifact name
  # without its Scala suffix, so a jsoniter-scala pin would freeze the Scala 3 modules too.
  # Instead, the Scala 2 version is pinned in mill-build/src/coursierbuild/Versions.scala with
  # a `// scala-steward:off` marker, and the Scala 3 one is left free to be updated.
]
